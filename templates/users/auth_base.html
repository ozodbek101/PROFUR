{% extends "base.html" %}
{% load static %}
{% block auth %}
<div class="flex min-h-screen flex-col items-center px-4 py-10 sm:py-16">
  <div class="mb-8 flex w-full {% block auth_header_width %}max-w-[400px]{% endblock %} items-center justify-between gap-3">
    <a href="{% url 'users:login' %}" class="flex items-center gap-2.5">
      <img src="{% static 'img/mark.svg' %}" alt="" width="32" height="32">
      <span class="font-semibold" style="font-size:17px">{{ brand_name }}</span>
    </a>
    {% include "partials/lang_switch.html" %}
  </div>
  <div class="w-full {% block auth_width %}max-w-[400px]{% endblock %}">
    {% include "partials/messages.html" %}
    {% block auth_content %}{% endblock %}
  </div>
</div>
{% endblock %}
